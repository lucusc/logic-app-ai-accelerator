name: Deploy

on:
  workflow_dispatch:
    inputs:
      parameter_file:
        description: Parameter file committed for the target environment
        required: true
        default: infra/main.parameters.example.json
      runner:
        description: Use a network-connected self-hosted runner for private deployments
        required: true
        default: ubuntu-latest

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ${{ inputs.runner }}
    environment: ${{ vars.AZURE_ENVIRONMENT_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        id: infrastructure
        shell: bash
        run: |
          deployment_name="accelerator-${GITHUB_RUN_ID}"
          az deployment sub create \
            --name "$deployment_name" \
            --location "${{ vars.AZURE_DEPLOYMENT_LOCATION }}" \
            --template-file infra/main.bicep \
            --parameters @"${{ inputs.parameter_file }}"
          az deployment sub show \
            --name "$deployment_name" \
            --query properties.outputs \
            --output json > deployment-outputs.json

      - name: Build application image
        shell: bash
        run: |
          registry_name="$(jq -r '.containerRegistryName.value' deployment-outputs.json)"
          az acr build \
            --registry "$registry_name" \
            --image accelerator:latest \
            --file app/backend/Dockerfile \
            .

      - name: Restart web application
        shell: bash
        run: |
          resource_group="$(jq -r '.applicationResourceGroupName.value' deployment-outputs.json)"
          web_app="$(jq -r '.webAppName.value' deployment-outputs.json)"
          az webapp restart --resource-group "$resource_group" --name "$web_app"

      - name: Package and deploy Logic App workflows
        shell: bash
        run: |
          resource_group="$(jq -r '.applicationResourceGroupName.value' deployment-outputs.json)"
          logic_app="$(jq -r '.logicAppName.value' deployment-outputs.json)"
          (
            cd app/logic
            zip -qr ../../logic-app.zip . \
              -x 'local.settings.json' \
              -x 'local.settings.example.json' \
              -x 'README.md'
          )
          az logicapp deployment source config-zip \
            --resource-group "$resource_group" \
            --name "$logic_app" \
            --src logic-app.zip

