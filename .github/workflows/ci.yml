name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-bicep@v2
      - name: Build Bicep
        run: bicep build infra/main.bicep
      - name: Validate Logic App project
        run: python scripts/validate_logic_app.py
      - name: Check parameter files
        run: python scripts/check_parameter_files.py

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.14.0 pytest==8.4.2
      - run: python -m ruff check scripts
      - run: python -m pytest -q scripts/tests

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            app/backend/requirements.txt
            app/backend/requirements-dev.txt
      - run: python -m pip install -r app/backend/requirements.txt -r app/backend/requirements-dev.txt
      - run: python -m ruff check app/backend/src app/backend/tests
      - run: python -m pytest -q app/backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

